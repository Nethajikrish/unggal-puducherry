<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Nama Puducherry</title>
<style>
  :root { --bg:#f4f6f7; --card:#fff; --text:#1c2b2d; --muted:#6b7a7d; --line:#e1e6e8; --accent:#00796b; --accent-soft:#e0f2f1; --bad:#c62828; --warn:#b26a00; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121819; --card:#1b2426; --text:#e6eeee; --muted:#93a3a6; --line:#2b3739; --accent:#4db6ac; --accent-soft:#1f3a37; --bad:#ef9a9a; --warn:#ffcc80; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .bar { max-width:1100px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .brand { font-weight:700; margin-right:auto; }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  nav button { border:0; background:none; padding:8px 12px; border-radius:8px; color:var(--muted); }
  nav button.active { background:var(--accent-soft); color:var(--accent); font-weight:600; }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  h2 { font-size:18px; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  input, select, button, textarea { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:var(--bad); }
  button.small { padding:4px 10px; font-size:13px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .stat b { display:block; font-size:24px; margin-top:4px; }
  .stat span { color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:13px; white-space:nowrap; }
  td.actions { white-space:nowrap; }
  .scroll { overflow-x:auto; }
  .badge { padding:2px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); white-space:nowrap; }
  .badge.good { color:var(--accent); border-color:var(--accent); }
  .badge.bad { color:var(--bad); border-color:var(--bad); }
  .badge.warn { color:var(--warn); border-color:var(--warn); }
  .muted { color:var(--muted); }
  .msg { color:var(--bad); margin:8px 0; }
  .chart { display:flex; align-items:flex-end; gap:6px; height:140px; padding-top:8px; }
  .chart div { flex:1; text-align:center; font-size:11px; color:var(--muted); display:flex; flex-direction:column; justify-content:flex-end; height:100%; }
  .chart i { display:block; background:var(--accent); border-radius:4px 4px 0 0; min-height:2px; }
  .chart span { margin-top:4px; }
  form.grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:12px; }
  form.grid label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
  form.grid label.wide { grid-column:1 / -1; }
  form.grid input, form.grid select, form.grid textarea { color:var(--text); }
  #login { max-width:380px; margin:12vh auto; }
</style>
</head>
<body>

<div id="login" class="card" hidden>
  <h2>Nama Puducherry Admin</h2>
  <p class="muted">Enter the admin key (<code>admin_key</code> in <code>api/config.php</code>).</p>
  <div class="row">
    <input id="key" type="password" placeholder="Admin key" autocomplete="current-password" style="flex:1">
    <button class="primary" id="go">Sign in</button>
  </div>
  <div class="msg" id="loginMsg"></div>
</div>

<div id="app" hidden>
  <header>
    <div class="bar">
      <span class="brand">🚕 Nama Puducherry Admin</span>
      <nav id="nav"></nav>
      <button id="out" class="small">Sign out</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<script>
const API = location.pathname.replace(/\/admin\/.*$/, '') + '/api';
const $ = (id) => document.getElementById(id);
const TABS = ['Dashboard', 'Drivers', 'Rides', 'Customers', 'Offers'];
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const state = { tab: sessionStorage.getItem('tab') || 'Dashboard', date: today(), driverFilter: 'pending', rideStatus: '' };
let key = sessionStorage.getItem('adminKey') || '';

async function call(method, path, body) {
  const res = await fetch(API + path, {
    method,
    headers: { 'X-Admin-Key': key, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 403) { signOut('Wrong admin key'); throw new Error('Forbidden'); }
  if (!res.ok) throw new Error(data.error || 'Request failed (' + res.status + ')');
  return data;
}

const esc = (s) => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
const rs = (n) => '₹' + Number(n || 0).toLocaleString('en-IN');
const statusClass = (s) => ({ approved: 'good', completed: 'good', rejected: 'bad', cancelled: 'bad', pending: 'warn', requested: 'warn' }[s] || '');
const badge = (s) => `<span class="badge ${statusClass(s)}">${esc(s)}</span>`;
const table = (heads, rows) => `<div class="card scroll"><table><thead><tr>${heads.map((h) => `<th>${h}</th>`).join('')}</tr></thead>
  <tbody>${rows.join('') || `<tr><td colspan="${heads.length}" class="muted">Nothing here yet.</td></tr>`}</tbody></table></div>`;
const time = (t) => esc((t || '').slice(11, 16));

// ---------- Views ----------
const views = {
  async Dashboard() {
    const s = await call('GET', '/admin/stats?date=' + state.date);
    const max = Math.max(1, ...s.series.map((d) => d.rides));
    return `
      <div class="row"><h2 style="margin:0">Rides on</h2>
        <input type="date" id="date" value="${s.date}"><button class="small" id="todayBtn">Today</button></div>
      <div class="stats">
        <div class="stat"><span>Total rides</span><b>${s.day.total}</b></div>
        <div class="stat"><span>Completed</span><b>${s.day.completed}</b></div>
        <div class="stat"><span>Cancelled</span><b>${s.day.cancelled}</b></div>
        <div class="stat"><span>In progress</span><b>${s.day.active}</b></div>
        <div class="stat"><span>Revenue (after discounts)</span><b>${rs(s.day.revenue)}</b></div>
        <div class="stat"><span>Discounts given</span><b>${rs(s.day.discounts)}</b></div>
      </div>
      <div class="stats">
        <div class="stat"><span>Drivers online now</span><b>${s.totals.drivers_online}</b></div>
        <div class="stat"><span>Approved drivers</span><b>${s.totals.drivers_approved}</b></div>
        <div class="stat"><span>Awaiting approval</span><b>${s.totals.drivers_pending}</b></div>
        <div class="stat"><span>Customers</span><b>${s.totals.customers}</b></div>
      </div>
      <div class="card"><h2>Last 14 days – rides per day</h2>
        <div class="chart">${s.series.map((d) => `<div title="${d.day}: ${d.rides} rides, ${rs(d.revenue)}">
          <i style="height:${(d.rides / max) * 100}%"></i><span>${d.rides}<br>${d.day.slice(8)}</span></div>`).join('') || '<span class="muted">No rides yet.</span>'}</div></div>`;
  },

  async Drivers() {
    const f = state.driverFilter;
    const rows = await call('GET', '/admin/drivers' + (f === 'all' ? '' : '?status=' + f));
    return `<h2>Drivers</h2>
      <div class="row">${['pending', 'approved', 'rejected', 'all'].map((x) =>
        `<button class="small ${x === f ? 'primary' : ''}" data-filter="${x}">${x[0].toUpperCase() + x.slice(1)}</button>`).join('')}</div>` +
      table(['Name', 'Phone', 'Vehicle', 'Number', 'Licence', 'Rides', 'Online', 'Status', ''], rows.map((d) => `<tr>
        <td>${esc(d.name)}</td><td>${esc(d.phone)}</td><td>${esc(d.vehicle_type)}</td><td>${esc(d.vehicle_number)}</td>
        <td>${esc(d.license_number)}</td><td>${d.rides_done}</td><td>${d.is_online ? '🟢' : '—'}</td><td>${badge(d.status)}</td>
        <td class="actions">
          ${d.status !== 'approved' ? `<button class="small primary" data-driver="${d.id}" data-s="approved">Approve</button>` : ''}
          ${d.status !== 'rejected' ? `<button class="small danger" data-driver="${d.id}" data-s="rejected">Reject</button>` : ''}
        </td></tr>`));
  },

  async Rides() {
    const q = '?date=' + state.date + (state.rideStatus ? '&status=' + state.rideStatus : '');
    const rows = await call('GET', '/admin/rides' + q);
    return `<div class="row"><h2 style="margin:0">Rides</h2>
        <input type="date" id="date" value="${state.date}">
        <select id="rideStatus">${['', 'requested', 'accepted', 'arrived', 'started', 'completed', 'cancelled']
          .map((s) => `<option value="${s}" ${s === state.rideStatus ? 'selected' : ''}>${s || 'All statuses'}</option>`).join('')}</select>
        <span class="muted">${rows.length} ride(s)</span></div>` +
      table(['#', 'Time', 'Customer', 'Driver', 'Vehicle', 'km', 'Fare', 'Offer', 'Status'], rows.map((r) => `<tr>
        <td>${r.id}</td><td>${time(r.created_at)}</td>
        <td>${esc(r.customer_name)}<br><span class="muted">${esc(r.customer_phone)}</span></td>
        <td>${r.driver_name ? esc(r.driver_name) + '<br><span class="muted">' + esc(r.driver_phone) + '</span>' : '—'}</td>
        <td>${esc(r.vehicle_type)}</td><td>${r.distance_km}</td>
        <td>${rs(r.fare - r.discount)}${r.discount > 0 ? `<br><span class="muted">−${rs(r.discount)}</span>` : ''}</td>
        <td>${esc(r.offer_code) || '—'}</td><td>${badge(r.status)}</td></tr>`));
  },

  async Customers() {
    const rows = await call('GET', '/admin/customers');
    return '<h2>Customers</h2>' + table(['Name', 'Phone', 'Joined', 'Completed rides'], rows.map((c) =>
      `<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${esc((c.created_at || '').slice(0, 10))}</td><td>${c.rides_done}</td></tr>`));
  },

  async Offers() {
    const rows = await call('GET', '/admin/offers');
    state.offers = rows;
    return `<h2>Offers</h2>
      <div class="card"><h2 id="formTitle" style="font-size:16px">New offer</h2>
        <form id="offerForm" class="grid">
          <input type="hidden" name="id">
          <label>Title<input name="title" required maxlength="100" placeholder="Welcome 20% off"></label>
          <label>For<select name="audience">
            <option value="customer">Customers</option><option value="driver">Drivers</option><option value="both">Both</option></select></label>
          <label>Promo code (customers)<input name="code" maxlength="20" placeholder="WELCOME20" style="text-transform:uppercase"></label>
          <label>Discount type<select name="discountType">
            <option value="">None (announcement only)</option><option value="percent">Percent %</option><option value="flat">Flat ₹</option></select></label>
          <label>Discount value<input name="discountValue" type="number" step="0.01" min="0"></label>
          <label>Max discount ₹ (optional)<input name="maxDiscount" type="number" step="0.01" min="0"></label>
          <label>Minimum fare ₹<input name="minFare" type="number" step="0.01" min="0" value="0"></label>
          <label>Valid from<input name="validFrom" type="date"></label>
          <label>Valid to<input name="validTo" type="date"></label>
          <label class="wide">Description (shown in the app)<textarea name="description" rows="2" maxlength="255"
            placeholder="Complete 10 rides this weekend and earn ₹300 bonus"></textarea></label>
          <label>Status<select name="isActive"><option value="1">Active</option><option value="0">Paused</option></select></label>
          <div class="row" style="align-self:end"><button class="primary" type="submit">Save offer</button>
            <button type="button" id="resetForm">Clear</button></div>
        </form>
        <div class="msg" id="offerMsg"></div>
        <p class="muted" style="margin:0">Customer offers with a code give a discount at booking. Offers for drivers are shown as announcements/incentives in the driver app.</p>
      </div>` +
      table(['Title', 'For', 'Code', 'Discount', 'Valid', 'Status', ''], rows.map((o) => `<tr>
        <td>${esc(o.title)}<br><span class="muted">${esc(o.description)}</span></td><td>${esc(o.audience)}</td><td>${esc(o.code) || '—'}</td>
        <td>${o.discount_type ? (o.discount_type === 'percent' ? o.discount_value + '%' : rs(o.discount_value)) +
          (o.max_discount ? ` (max ${rs(o.max_discount)})` : '') + (o.min_fare > 0 ? `<br><span class="muted">min fare ${rs(o.min_fare)}</span>` : '') : '—'}</td>
        <td>${esc(o.valid_from || 'now')} → ${esc(o.valid_to || 'no end')}</td>
        <td>${o.is_active ? badge('active').replace('badge ', 'badge good') : badge('paused')}</td>
        <td class="actions"><button class="small" data-edit="${o.id}">Edit</button>
          <button class="small" data-toggle="${o.id}">${o.is_active ? 'Pause' : 'Activate'}</button>
          <button class="small danger" data-del="${o.id}">Delete</button></td></tr>`));
  },
};

// ---------- Rendering & events ----------
function drawNav() {
  $('nav').innerHTML = TABS.map((t) => `<button data-tab="${t}" class="${t === state.tab ? 'active' : ''}">${t}</button>`).join('');
}

async function render() {
  drawNav();
  try {
    $('view').innerHTML = await views[state.tab]();
  } catch (e) {
    if (key) $('view').innerHTML = `<div class="msg">${esc(e.message)}</div>`;
  }
}

function signOut(msg) {
  key = '';
  sessionStorage.removeItem('adminKey');
  $('app').hidden = true;
  $('login').hidden = false;
  $('loginMsg').textContent = msg || '';
}

async function signIn() {
  $('app').hidden = false;
  $('login').hidden = true;
  await render();
}

$('go').onclick = () => { key = $('key').value; sessionStorage.setItem('adminKey', key); signIn(); };
$('key').onkeydown = (e) => { if (e.key === 'Enter') $('go').click(); };
$('out').onclick = () => { $('key').value = ''; signOut(''); };

document.addEventListener('click', async (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;
  try {
    if (d.tab) { state.tab = d.tab; sessionStorage.setItem('tab', d.tab); return render(); }
    if (d.filter) { state.driverFilter = d.filter; return render(); }
    if (d.driver) { await call('PATCH', '/admin/drivers/' + d.driver, { status: d.s }); return render(); }
    if (b.id === 'todayBtn') { state.date = today(); return render(); }
    if (d.del && confirm('Delete this offer?')) { await call('DELETE', '/admin/offers/' + d.del); return render(); }
    if (d.toggle) {
      const o = state.offers.find((x) => x.id == d.toggle);
      await call('PATCH', '/admin/offers/' + o.id, offerPayload(o, { isActive: o.is_active ? 0 : 1 }));
      return render();
    }
    if (d.edit) {
      const o = state.offers.find((x) => x.id == d.edit), f = $('offerForm');
      f.id.value = o.id; f.title.value = o.title; f.audience.value = o.audience; f.code.value = o.code || '';
      f.discountType.value = o.discount_type || ''; f.discountValue.value = o.discount_value ?? '';
      f.maxDiscount.value = o.max_discount ?? ''; f.minFare.value = o.min_fare; f.validFrom.value = o.valid_from || '';
      f.validTo.value = o.valid_to || ''; f.description.value = o.description || ''; f.isActive.value = o.is_active;
      $('formTitle').textContent = 'Edit offer #' + o.id;
      return f.scrollIntoView({ behavior: 'smooth' });
    }
    if (b.id === 'resetForm') return render();
  } catch (err) { alert(err.message); }
});

document.addEventListener('change', (e) => {
  if (e.target.id === 'date') { state.date = e.target.value || today(); render(); }
  if (e.target.id === 'rideStatus') { state.rideStatus = e.target.value; render(); }
});

function offerPayload(o, over = {}) {
  return { title: o.title, description: o.description, audience: o.audience, code: o.code, discountType: o.discount_type,
    discountValue: o.discount_value, maxDiscount: o.max_discount, minFare: o.min_fare, validFrom: o.valid_from,
    validTo: o.valid_to, isActive: o.is_active, ...over };
}

document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'offerForm') return;
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  const id = f.id; delete f.id;
  try {
    await call(id ? 'PATCH' : 'POST', '/admin/offers' + (id ? '/' + id : ''), f);
    render();
  } catch (err) { $('offerMsg').textContent = err.message; }
});

if (key) signIn(); else $('login').hidden = false;
</script>
</body>
</html>
